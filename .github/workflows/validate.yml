name: Validate evaluation data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run validator regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate example dataset
        run: >-
          python scripts/validate_eval_csv.py examples/knowledge-base-eval/dataset.csv
          --schema dataset --metrics M1 M2 M3 --min-coverage 5 --expected-count 12

      - name: Validate scored workbench
        run: >-
          python scripts/validate_eval_csv.py examples/knowledge-base-eval/workbench.csv
          --schema workbench --expected-count 36

      - name: Validate initial workbench
        run: >-
          python scripts/validate_eval_csv.py examples/knowledge-base-eval/workbench-initial.csv
          --schema workbench --initial --expected-count 36

      - name: Check example relationships and summary
        run: python examples/knowledge-base-eval/check_example.py
